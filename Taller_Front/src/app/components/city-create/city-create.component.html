<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Nueva Ciudad</h5>
    <form (ngSubmit)="submitForm()">
      <div class="mb-3">
        <label for="cityName" class="form-label">Nombre de la Ciudad</label>
        <input
          type="text"
          class="form-control"
          id="cityName"
          [(ngModel)]="cityName"
          name="cityName"
          placeholder="Ej: Madrid"
        />
      </div>
      <div class="mb-3">
        <label for="countrySelect" class="form-label">País</label>
        <select
          class="form-select"
          id="countrySelect"
          [(ngModel)]="selectedCountryId"
          name="selectedCountryId"
        >
          <option [value]="null">-- Selecciona un país --</option>
          @for (country of countries; track country.id) {
            <option [value]="country.id">{{ country.name }}</option>
          }
        </select>
      </div>
      <div class="d-flex gap-2">
        <button
          type="submit"
          class="btn btn-success"
          [disabled]="!isFormValid() || isSubmitting"
        >
          {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="isSubmitting"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
